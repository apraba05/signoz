apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: default
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: demo-app:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            # OTLP gRPC on the in-cluster SigNoz collector (release name: signoz).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: signoz-otel-collector.platform.svc.cluster.local:4317
            - name: LISTEN_ADDR
              value: ":8080"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: default
spec:
  selector:
    app: demo-app
  ports:
    - name: http
      port: 8080
      targetPort: http
